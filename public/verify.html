<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Oracle · settle it with a photo</title>
<style>
  body { margin:0; font-family:-apple-system, system-ui, sans-serif; background:#0d0f14; color:#eef0f4; }
  .wrap { max-width:460px; margin:0 auto; padding:28px 20px; text-align:center; }
  .owl { font-size:56px; }
  h1 { font-size:22px; margin:8px 0 4px; }
  p { color:#8e96a5; line-height:1.45; }
  .q { background:#161a22; border:1px solid #252a35; border-radius:14px; padding:16px; margin:18px 0; font-size:17px; }
  label.btn, button { display:block; width:100%; padding:16px; border-radius:12px; border:0; font-size:17px; font-weight:700; margin-top:12px; cursor:pointer; }
  label.btn { background:#f5b83d; color:#1b1400; }
  button { background:#46c486; color:#04210f; } button:disabled { opacity:.5; }
  img { width:100%; border-radius:12px; margin-top:14px; display:none; }
  #msg { margin-top:16px; font-size:16px; min-height:24px; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="owl">🦉</div>
  <h1>Settle it with a photo</h1>
  <p id="sub">Loading…</p>
  <div class="q" id="q"></div>
  <label class="btn" for="file">📸 Take photo</label>
  <input id="file" type="file" accept="image/*" capture="environment" />
  <img id="preview" alt="preview" />
  <button id="send" disabled>Send for verification</button>
  <div id="msg"></div>
</div>
<script>
const token = location.pathname.split("/").pop();
const $ = (id) => document.getElementById(id);
let photo = null, coords = {};

fetch(`/api/verify/${token}`).then((r) => r.json()).then((d) => {
  if (d.error) { $("sub").textContent = d.error; $("q").style.display = "none"; return; }
  $("sub").textContent = `People at ${d.place} disagree. Take one photo that shows the answer.`;
  $("q").textContent = d.question;
});

// Location is captured when the photo is taken (needs HTTPS; skipped gracefully otherwise).
function locate() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    (p) => { coords = { lat: p.coords.latitude, lng: p.coords.longitude }; },
    () => {}, { enableHighAccuracy: true, timeout: 8000 }
  );
}

// Shrink to 1280px JPEG so uploads are fast.
$("file").onchange = async (e) => {
  const file = e.target.files[0]; if (!file) return;
  locate();
  const img = await createImageBitmap(file);
  const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  photo = c.toDataURL("image/jpeg", 0.8);
  $("preview").src = photo; $("preview").style.display = "block"; $("send").disabled = false;
};

$("send").onclick = async () => {
  $("send").disabled = true; $("msg").textContent = "Checking your photo…";
  const r = await fetch(`/api/verify/${token}`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ image: photo, mime: "image/jpeg", ...coords, takenAt: new Date().toISOString() }),
  }).then((x) => x.json());
  $("msg").textContent = r.error || (r.ok ? `✅ ${r.message}` : `❌ ${r.message}`);
  if (!r.ok) $("send").disabled = false;
};
</script>
</body>
</html>
