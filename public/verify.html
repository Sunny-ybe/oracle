<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Oracle · settle it with a photo</title>
<link rel="icon" href="/icon.png?s=64" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" />
<link rel="stylesheet" href="/ink.css" />
<style>
  /* Same cream "ink" look as the app (tokens in /ink.css). */
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; color: var(--char); font: 600 16px/1.45 var(--fr); }
  .wrap { max-width: 460px; margin: 0 auto; padding: 28px 20px; text-align: center; }
  .owl { width: 110px; height: 110px; margin: 0 auto; border-radius: 50%; background: var(--peri-soft); display: grid; place-items: center; }
  .owl img { width: 112%; margin-top: -10px; }
  h1 { font-size: 26px; font-weight: 900; letter-spacing: -.015em; margin: 14px 0 4px; }
  p { color: var(--muted); line-height: 1.45; }
  .q { background: #fff; border: var(--stroke) solid var(--char); border-radius: 22px; box-shadow: 5px 5px 0 var(--char); padding: 16px; margin: 18px 0; font-size: 17px; font-weight: 800; }
  label.btn, button { display: block; width: 100%; padding: 15px; border-radius: 18px; border: var(--stroke) solid var(--char); box-shadow: 4px 4px 0 var(--char); font: 900 17px var(--fr); margin-top: 14px; cursor: pointer; }
  label.btn:active, button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--char); }
  label.btn { background: var(--butter); color: var(--char); }
  button { background: var(--blue); color: #fff; }
  button:disabled { background: #E9E1D6; color: var(--muted); box-shadow: 2px 2px 0 var(--char); }
  #preview { width: 100%; border-radius: 16px; border: var(--stroke) solid var(--char); margin-top: 14px; display: none; }
  #msg { margin-top: 16px; font-size: 16px; min-height: 24px; }
  input[type=file] { display: none; }
</style>
</head>
<body class="dots-bg">
<div class="wrap">
  <div class="owl"><img src="/img/ora.png" alt="" /></div>
  <h1>Settle it with a photo</h1>
  <p id="sub">Loading…</p>
  <div class="q" id="q"></div>
  <label class="btn" for="file">📸 Take photo</label>
  <input id="file" type="file" accept="image/*" capture="environment" />
  <img id="preview" alt="preview" />
  <button id="send" disabled>Send for verification</button>
  <div id="msg"></div>
</div>
<script>
const token = location.pathname.split("/").pop();
const $ = (id) => document.getElementById(id);
let photo = null, coords = {};

fetch(`/api/verify/${token}`).then((r) => r.json()).then((d) => {
  if (d.error) { $("sub").textContent = d.error; $("q").style.display = "none"; return; }
  $("sub").textContent = `People at ${d.place} disagree. Take one photo that shows the answer.`;
  $("q").textContent = d.question;
});

// Location is captured when the photo is taken (needs HTTPS; skipped gracefully otherwise).
function locate() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    (p) => { coords = { lat: p.coords.latitude, lng: p.coords.longitude }; },
    () => {}, { enableHighAccuracy: true, timeout: 8000 }
  );
}

// Shrink to 1280px JPEG so uploads are fast.
$("file").onchange = async (e) => {
  const file = e.target.files[0]; if (!file) return;
  locate();
  const img = await createImageBitmap(file);
  const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  photo = c.toDataURL("image/jpeg", 0.8);
  $("preview").src = photo; $("preview").style.display = "block"; $("send").disabled = false;
};

$("send").onclick = async () => {
  $("send").disabled = true; $("msg").textContent = "Checking your photo…";
  const r = await fetch(`/api/verify/${token}`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ image: photo, mime: "image/jpeg", ...coords, takenAt: new Date().toISOString() }),
  }).then((x) => x.json());
  $("msg").textContent = r.error || (r.ok ? `✅ ${r.message}` : `❌ ${r.message}`);
  if (!r.ok) $("send").disabled = false;
};
</script>
</body>
</html>
